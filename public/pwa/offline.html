<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <title>Offline - LeonFrutta Admin</title>
    <style>
        :root { color-scheme: light dark; }
        html { touch-action: manipulation; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f9fafb;
            color: #111827;
            text-align: center;
        }
        main { max-width: 22rem; }
        img { width: 72px; height: 72px; border-radius: 18px; background: #09090b; }
        h1 { font-size: 1.25rem; margin: 20px 0 8px; }
        p { margin: 0 0 24px; color: #4b5563; line-height: 1.5; }
        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #d97706;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            cursor: pointer;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #030712; color: #f9fafb; }
            p { color: #9ca3af; }
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa/icons/icon-192.png" alt="">
        <h1>Sei offline</h1>
        <p>Il pannello LeonFrutta ha bisogno di una connessione a internet. Controlla la rete e riprova.</p>
        <button type="button" onclick="location.reload()">Riprova</button>
    </main>
</body>
</html>
